<script>
// ── Theme (before-paint) ──────────────────────────────
(function () {
  // Manual choice lasts for this visit only; otherwise follow the clock (07:00-19:00 = light)
  var t = sessionStorage.getItem('theme');
  if (t !== 'light' && t !== 'dark') {
    var h = new Date().getHours();
    t = (h >= 7 && h < 19) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
  var fs = localStorage.getItem('fontsize') || 'medium';
  document.documentElement.setAttribute('data-fontsize', fs);
})();
</script>

<script>
// ── Navbar buttons: theme + font size ─────────────────
document.addEventListener('DOMContentLoaded', function () {
  // Theme toggle button
  var themeBtn = document.createElement('button');
  themeBtn.id = 'themeToggleBtn';
  themeBtn.className = 'navbar-icon-btn';
  var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  themeBtn.textContent = currentTheme === 'dark' ? '☀' : '☾';
  themeBtn.onclick = function () {
    var t = document.documentElement.getAttribute('data-theme') || 'light';
    var next = t === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    sessionStorage.setItem('theme', next);
    themeBtn.textContent = next === 'dark' ? '☀' : '☾';
  };

  // Font size toggle button
  var FS_ORDER = ['small', 'medium', 'large'];
  var FS_LABEL = { small: 'A-', medium: 'A', large: 'A+' };
  var fontBtn = document.createElement('button');
  fontBtn.id = 'fontSizeBtn';
  fontBtn.className = 'navbar-icon-btn';
  fontBtn.title = 'Font size';
  var currentFS = document.documentElement.getAttribute('data-fontsize') || 'medium';
  fontBtn.textContent = FS_LABEL[currentFS];
  fontBtn.onclick = function () {
    var cur = document.documentElement.getAttribute('data-fontsize') || 'medium';
    var next = FS_ORDER[(FS_ORDER.indexOf(cur) + 1) % FS_ORDER.length];
    document.documentElement.setAttribute('data-fontsize', next);
    localStorage.setItem('fontsize', next);
    fontBtn.textContent = FS_LABEL[next];
  };

  // Wrap buttons together, insert right before search icon
  var wrap = document.createElement('div');
  wrap.className = 'navbar-btn-group';
  wrap.appendChild(fontBtn);
  wrap.appendChild(themeBtn);

  var search = document.querySelector('#quarto-search');
  if (search && search.parentNode) {
    search.parentNode.insertBefore(wrap, search);
  } else {
    var nb = document.querySelector('.navbar-collapse, .navbar > .container-fluid, .navbar > .container');
    if (nb) nb.appendChild(wrap);
  }
});
</script>
